# generator.yml - dùng với công cụ chính thức prometheus/snmp_exporter (snmp_generator)
# Xem hướng dẫn dùng ở cuối file / trong README đi kèm.
#
# LƯU Ý: các module dưới đây liệt kê theo TÊN OBJECT trong MIB (không phải OID số),
# generator sẽ tự tra cứu OID + kiểu dữ liệu + mô tả từ các file MIB bạn cung cấp
# trong thư mục ./mibs. Cần có đầy đủ MIB gốc (kể cả các MIB phụ thuộc, ví dụ
# CISCO-PROCESS-MIB phụ thuộc CISCO-SMI, CISCO-TC...) thì generator mới chạy được.

# Bắt buộc với snmp_exporter v0.30+: khai báo auth ở đây, tên "public_v2" phải khớp
# với "auth: [public_v2]" trong prometheus.yml
auths:
  public_v2:
    version: 2
    community: public

modules:

  # =========================================================
  # MIKROTIK - IF-MIB chuẩn + HOST-RESOURCES-MIB + MIKROTIK-MIB riêng
  # =========================================================
  mikrotik:
    walk:
      - sysDescr
      - sysObjectID
      - sysUpTime
      - sysName
      - sysContact
      - sysLocation
      - ifDescr
      - ifIndex
      - ifType
      - ifSpeed
      - ifPhysAddress
      - ifOperStatus
      - ifAdminStatus
      - ifName
      - ifAlias
      - ifHCInOctets
      - ifHCOutOctets
      - ifInErrors
      - ifOutErrors
      - ifInDiscards
      - ifOutDiscards
      - ifInUnknownProtos
      - ifOutQLen
      - ifHCInUcastPkts
      - ifHCInMulticastPkts
      - ifHCInBroadcastPkts
      - ifHCOutUcastPkts
      - ifHCOutMulticastPkts
      - ifHCOutBroadcastPkts
      - ifHighSpeed
      - hrProcessorLoad
      - hrStorageDescr
      - hrStorageSize
      - hrStorageUsed
      - hrSystemUptime
      # Chuẩn HOST-RESOURCES-MIB, dùng cho panel disk/device status & ngày hệ thống:
      - hrDeviceStatus
      - hrDeviceErrors
      - hrSystemDate
      # Sức khỏe phần cứng (đã xác nhận tồn tại trong mikrotik.mib - nhóm mtxrHealth):
      - mtxrHlTemperature
      - mtxrHlProcessorTemperature
      - mtxrHlBoardTemperature
      - mtxrHlSensorTemperature
      - mtxrHlVoltage
      - mtxrHlCoreVoltage
      - mtxrHlThreeDotThreeVoltage
      - mtxrHlFiveVoltage
      - mtxrHlTwelveVoltage
      - mtxrHlCpuTemperature
      - mtxrHlPower
      - mtxrHlActiveFan
      - mtxrHlFanSpeed1
      - mtxrHlFanSpeed2
      - mtxrHlPowerSupplyState
      - mtxrHlBackupPowerSupplyState
      - mtxrHlProcessorFrequency
      # License / thông tin phần mềm (nhóm mtxrLicense):
      - mtxrLicLevel
      - mtxrLicVersion
      - mtxrLicSoftwareId
      # Ngày giờ hệ thống:
      - mtxrDate
      # Queue Tree (traffic shaping) - dùng cho panel băng thông theo hàng đợi:
      - mtxrQueueTreeHCBytes
      - mtxrQueueTreeName
      # Số lease DHCP đang cấp:
      - mtxrDHCPLeaseCount
      # Thông tin thiết bị (nhóm mtxrSystem):
      - mtxrSerialNumber
      - mtxrFirmwareVersion
      - mtxrFirmwareUpgradeVersion
      - mtxrBoardName
      # PoE theo từng cổng (nhóm mtxrPOE):
      - mtxrPOEStatus
      - mtxrPOECurrent
      - mtxrPOEVoltage
      - mtxrPOEPower
      - mtxrPOEName
      # Neighbor discovery (nhóm mtxrNeighbor):
      - mtxrNeighborTable
      # Thống kê wireless AP (nhóm mtxrWireless - dùng cho thiết bị phát WiFi):
      - mtxrWlApClientCount
      - mtxrWlApAuthClientCount
      - mtxrWlApSsid
      - mtxrWlApFreq
      - mtxrWlApOverallTxCCQ
      - mtxrWlApNoiseFloor
      - mtxrWlStatTable
      # Thống kê chi tiết Ethernet theo từng cổng (bảng mtxrInterfaceStats -
      # dùng cho các panel "Tx/Rx Eth errors, etc" - lỗi CRC, collision, jabber,
      # phân bố kích thước gói tin, pause frame...):
      - mtxrInterfaceStatsName
      - mtxrInterfaceStatsRxBytes
      - mtxrInterfaceStatsRxPackets
      - mtxrInterfaceStatsTxBytes
      - mtxrInterfaceStatsTxPackets
      - mtxrInterfaceStatsRxDrop
      - mtxrInterfaceStatsTxDrop
      - mtxrInterfaceStatsLinkDowns
      - mtxrInterfaceStatsRxCodeError
      - mtxrInterfaceStatsRxAlignError
      - mtxrInterfaceStatsRxFCSError
      - mtxrInterfaceStatsRxLengthError
      - mtxrInterfaceStatsRxCarrierError
      - mtxrInterfaceStatsRxOverflow
      - mtxrInterfaceStatsRxJabber
      - mtxrInterfaceStatsRxFragment
      - mtxrInterfaceStatsRxTooLong
      - mtxrInterfaceStatsRxTooShort
      - mtxrInterfaceStatsRxUnknownOp
      - mtxrInterfaceStatsRxPause
      - mtxrInterfaceStatsRxBroadcast
      - mtxrInterfaceStatsRxMulticast
      - mtxrInterfaceStatsRxControl
      - mtxrInterfaceStatsTxCollision
      - mtxrInterfaceStatsTxTotalCollision
      - mtxrInterfaceStatsTxSingleCollision
      - mtxrInterfaceStatsTxMultipleCollision
      - mtxrInterfaceStatsTxLateCollision
      - mtxrInterfaceStatsTxExcessiveCollision
      - mtxrInterfaceStatsTxDeferred
      - mtxrInterfaceStatsTxExcessiveDeferred
      - mtxrInterfaceStatsTxFCSError
      - mtxrInterfaceStatsTxJabber
      - mtxrInterfaceStatsTxFragment
      - mtxrInterfaceStatsTxTooLong
      - mtxrInterfaceStatsTxTooShort
      - mtxrInterfaceStatsTxUnderrun
      - mtxrInterfaceStatsTxBroadcast
      - mtxrInterfaceStatsTxMulticast
      - mtxrInterfaceStatsTxControl
      - mtxrInterfaceStatsTxPause
      - mtxrInterfaceStatsTxPauseHonored
      - mtxrInterfaceStatsRx64
      - mtxrInterfaceStatsRx65To127
      - mtxrInterfaceStatsRx128To255
      - mtxrInterfaceStatsRx256To511
      - mtxrInterfaceStatsRx512To1023
      - mtxrInterfaceStatsRx1024To1518
      - mtxrInterfaceStatsRx1519ToMax
      - mtxrInterfaceStatsTx64
      - mtxrInterfaceStatsTx65To127
      - mtxrInterfaceStatsTx128To255
      - mtxrInterfaceStatsTx256To511
      - mtxrInterfaceStatsTx512To1023
      - mtxrInterfaceStatsTx1024To1518
      - mtxrInterfaceStatsTx1519ToMax
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifDescr
      - source_indexes: [ifIndex]
        lookup: ifName
      - source_indexes: [ifIndex]
        lookup: ifAlias
      # Bảng mtxrInterfaceStats dùng chỉ số riêng (mtxrInterfaceStatsIndex),
      # nhưng trùng giá trị với ifIndex trên RouterOS -> lookup chéo sang ifName
      # để panel Grafana lọc theo $Interface hoạt động đúng.
      - source_indexes: [mtxrInterfaceStatsIndex]
        lookup: ifName
      - source_indexes: [mtxrInterfaceStatsIndex]
        lookup: mtxrInterfaceStatsName
    overrides:
      ifAlias:
        ignore: false
      ifName:
        ignore: false

  # =========================================================
  # CISCO - TẠM THỜI chỉ dùng object chuẩn IF-MIB/SNMPv2-MIB (không cần MIB riêng).
  # Sau khi có file MIB gốc của Cisco (CISCO-SMI, CISCO-TC, CISCO-PROCESS-MIB,
  # CISCO-MEMORY-POOL-MIB, CISCO-ENVMON-MIB, ENTITY-MIB...), bổ sung lại các dòng
  # CPU/RAM/nhiệt độ đã bị comment bên dưới.
  # =========================================================
  cisco:
    walk:
      - sysDescr
      - sysUpTime
      - sysName
      - ifIndex
      - ifDescr
      - ifType
      - ifSpeed
      - ifOperStatus
      - ifAdminStatus
      - ifName
      - ifAlias
      - ifHCInOctets
      - ifHCOutOctets
      - ifInErrors
      - ifOutErrors
      - ifHighSpeed
      # --- Cần MIB gốc Cisco, tạm comment ---
      # - cpmCPUTotal1minRev
      # - cpmCPUTotal5minRev
      # - ciscoMemoryPoolUsed
      # - ciscoMemoryPoolFree
      # - ciscoEnvMonTemperatureStatusValue
      # - ciscoEnvMonFanStatusDescr
      # - ciscoEnvMonSupplyStatusDescr
      # - entPhysicalDescr
      # - entPhysicalSerialNum
      # - entPhysicalSoftwareRev
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifDescr
      - source_indexes: [ifIndex]
        lookup: ifName

  # =========================================================
  # FORTINET - TẠM THỜI chỉ dùng object chuẩn IF-MIB/SNMPv2-MIB (không cần MIB riêng).
  # Sau khi có file MIB gốc của Fortinet (FORTINET-CORE-MIB, FORTINET-FORTIGATE-MIB),
  # bổ sung lại các dòng CPU/RAM/VPN/HA đã bị comment bên dưới.
  # =========================================================
  fortinet:
    walk:
      - sysDescr
      - sysUpTime
      - sysName
      - ifIndex
      - ifDescr
      - ifType
      - ifSpeed
      - ifOperStatus
      - ifAdminStatus
      - ifName
      - ifAlias
      - ifHCInOctets
      - ifHCOutOctets
      - ifInErrors
      - ifOutErrors
      - ifHighSpeed
      # --- Cần MIB gốc Fortinet, tạm comment ---
      # - fgSysCpuUsage
      # - fgSysMemUsage
      # - fgSysMemCapacity
      # - fgSysDiskUsage
      # - fgSysDiskCapacity
      # - fgSysSesCount
      # - fgSysSesRate
      # - fgVpnTunEntStatus
      # - fgVpnTunEntPhase1Name
      # - fgHaStatsHostname
      # - fgHaStatsCpuUsage
      # - fgSysVersion
    lookups:
      - source_indexes: [ifIndex]
        lookup: ifDescr
      - source_indexes: [ifIndex]
        lookup: ifName
