version: "3.9"

networks:
  monitoring-net:
    driver: bridge

volumes:
  mysql-data:
  zabbix-data:
  grafana-data:
  prometheus-data:
  alertmanager-data:

services:

  # ===================== DATABASE =====================
  mysql-server:
    image: mariadb:11
    container_name: mysql-server
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --max-allowed-packet=256M
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD-SHELL","mariadb-admin ping -uroot -p$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ===================== ZABBIX SERVER =====================
  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.2-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql-server
      DB_SERVER_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ZBX_STARTPOLLERS: 20
      ZBX_STARTPINGERS: 10
      ZBX_CACHESIZE: 256M
      ZBX_HISTORYCACHESIZE: 128M
      ZBX_HISTORYINDEXCACHESIZE: 64M
      ZBX_TIMEOUT: 30
    depends_on:
      mysql-server:
        condition: service_healthy
    ports:
      - "10051:10051"
    volumes:
      - zabbix-data:/var/lib/zabbix
      - ./zabbix/alertscripts:/usr/lib/zabbix/alertscripts:rw
    networks:
      - monitoring-net

  # ===================== ZABBIX WEB =====================
  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.2-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql-server
      DB_SERVER_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${PHP_TZ}
    depends_on:
      zabbix-server:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - monitoring-net

  # ===================== ZABBIX AGENT =====================
  zabbix-agent:
    image: zabbix/zabbix-agent:ubuntu-7.2-latest
    container_name: zabbix-agent
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: docker-host
      ZBX_SERVER_HOST: zabbix-server
    networks:
      - monitoring-net

  # ===================== PROMETHEUS =====================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager
    networks:
      - monitoring-net

  # ===================== ALERTMANAGER =====================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager:/etc/alertmanager
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "9093:9093"
    networks:
      - monitoring-net

  # ===================== SNMP EXPORTER =====================
  snmp_exporter:
    image: prom/snmp-exporter:latest
    container_name: snmp_exporter
    restart: unless-stopped
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
    volumes:
      - ./snmp_exporter:/etc/snmp_exporter
    ports:
      - "9116:9116"
    networks:
      - monitoring-net

  # ===================== GRAFANA =====================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - zabbix-web
    networks:
      - monitoring-net
