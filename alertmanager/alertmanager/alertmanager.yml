global:
  resolve_timeout: 5m

route:
  receiver: "telegram-default"
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: "telegram-default"
    telegram_configs:
      # Người nhận 1
      - bot_token: "8577585868:AAHm5xzKBWmrQgT5cHCMD6DVWTehzo2l5kM"
        chat_id: 8577992717
        api_url: "https://api.telegram.org"
        parse_mode: "HTML"
        message: |
          <b>{{ .Status | toUpper }}</b> - {{ .CommonLabels.alertname }}
          Instance: {{ .CommonLabels.instance }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
      # Người nhận 2 - thêm bao nhiêu người thì thêm bấy nhiêu khối tương tự,
      # chỉ cần đổi chat_id (bot_token và message giữ nguyên):
      - bot_token: "8577585868:AAHm5xzKBWmrQgT5cHCMD6DVWTehzo2l5kM"
        chat_id: 1951764110 # thay bằng chat_id thật của người 2
        api_url: "https://api.telegram.org"
        parse_mode: "HTML"
        message: |
          <b>{{ .Status | toUpper }}</b> - {{ .CommonLabels.alertname }}
          Instance: {{ .CommonLabels.instance }}
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=warning"]
    equal: ["alertname", "instance"]
